<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-labelledby="title desc">
  <title id="title">Piyush Patil — Turning ideas into working products</title>
  <desc id="desc">A dark navy editorial banner with subtle teal geometric lines and a modern technology aesthetic.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.58" stop-color="#101d2c"/>
      <stop offset="1" stop-color="#102d35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="36%" r="65%">
      <stop offset="0" stop-color="#0f766e" stop-opacity=".34"/>
      <stop offset="1" stop-color="#0f766e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#94a3b8" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="330" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="330" rx="22" fill="url(#glow)"/>
  <rect width="1280" height="330" rx="22" fill="url(#grid)"/>
  <g fill="none" stroke="url(#accent)" stroke-width="1.5" opacity=".52">
    <path d="M875 0C900 80 1030 70 1072 146s-36 133 19 184"/>
    <path d="M951 0c25 84 138 77 172 143s-18 136 39 187" opacity=".55"/>
    <circle cx="1080" cy="158" r="94" opacity=".22"/>
    <circle cx="1080" cy="158" r="132" opacity=".14"/>
    <path d="M1015 158h130M1080 93v130" opacity=".25"/>
  </g>
  <g fill="#67e8f9" opacity=".8">
    <circle cx="875" cy="66" r="3"/><circle cx="1175" cy="250" r="3"/><circle cx="1000" cy="285" r="2"/>
  </g>
  <rect x="78" y="62" width="54" height="4" rx="2" fill="url(#accent)"/>
  <text x="78" y="142" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1.8" fill="#f8fafc">PIYUSH PATIL</text>
  <text x="80" y="190" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#67e8f9">Turning ideas into working products.</text>
  <text x="80" y="232" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#cbd5e1">Aligning business, technology and people to make things happen.</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.7" fill="#99f6e4">
    <text x="80" y="283">PRODUCT</text><text x="183" y="283" fill="#64748b">/</text>
    <text x="202" y="283">TECHNOLOGY</text><text x="322" y="283" fill="#64748b">/</text>
    <text x="342" y="283">DELIVERY</text><text x="433" y="283" fill="#64748b">/</text>
    <text x="452" y="283">AI-ASSISTED BUILDING</text>
  </g>
</svg>
